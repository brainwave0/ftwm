[DEFAULT]
# Multiplies the panning distance relative to tracked face position. Increase this value to get more range of motion, or decrease it for more precision.
scale = 1

# Limits tracking and panning rate to reduce CPU usage.
frame_rate = 60.0

# Smooths panning motions using average positions for the specified number of previous frames.
moving_average_period = 4

# Value is in milliseconds.
panning_resume_delay = 1000

# An upper limit for window dimensions to prevent crashing
max_size = 8192

# Uncomment and set for a command to run after the window manager is initialized. The environment variable FTWMPID will be set for usage with waitpid in shell scripts.
# startup_command = ~/startup.sh

[Camera]
# Uncomment and set the following to pick a specific camera.
# index = 0

# Higher FPS may make movements smoother, but may or may not be supported by your camera.
fps = 60

# Uncomment and set the following to pick a specific camera resolution.
# capture_width = 640
# capture_height = 480

[Face Tracker]
detection_threshold = 0.5

# Determines the bounding box size for the face tracker.
tracking_area = 96
